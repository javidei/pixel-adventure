name: Export Pixel Adventure Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pixel-adventure-pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"

jobs:
  export-web:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reparar fuente ONESR
        shell: bash
        run: |
          set -e
          FONT="assets/fonts/ONESR___.TTF"
          CURRENT_SIZE=$(wc -c < "$FONT" 2>/dev/null || echo 0)
          echo "ONESR actual: ${CURRENT_SIZE} bytes"

          if [ "$CURRENT_SIZE" -lt 9000 ]; then
            apt-get update -qq
            apt-get install -y -qq curl unzip ca-certificates >/dev/null

            TMP_FONT="/tmp/ONESR___.TTF"
            if ! curl -fL --retry 3 --connect-timeout 20 \
              "https://fontsforyou.com/fonts/o/Onesr.ttf" \
              -o "$TMP_FONT"; then
              echo "Fallo la descarga principal; probando DaFont..."
              curl -fL --retry 3 --connect-timeout 20 \
                "https://dl.dafont.com/dl/?f=onesize" \
                -o /tmp/onesize.zip
              unzip -jo /tmp/onesize.zip 'ONESR___.TTF' -d /tmp
              mv /tmp/ONESR___.TTF "$TMP_FONT"
            fi

            NEW_SIZE=$(wc -c < "$TMP_FONT")
            echo "ONESR descargada: ${NEW_SIZE} bytes"
            if [ "$NEW_SIZE" -lt 9000 ]; then
              echo "La fuente descargada sigue incompleta."
              exit 1
            fi
            mv "$TMP_FONT" "$FONT"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$FONT"
            if ! git diff --cached --quiet; then
              git commit -m "fix: restaurar ONESR TTF completo [skip ci]"
              git push origin HEAD:main
            fi
          fi

          FINAL_SIZE=$(wc -c < "$FONT")
          test "$FINAL_SIZE" -ge 9000
          echo "ONESR validada: ${FINAL_SIZE} bytes"

      - name: Preparar plantillas de exportación
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mkdir -p "$HOME/.config"
          if [ -d /root/.config/godot ]; then
            mv /root/.config/godot "$HOME/.config/godot"
          fi
          mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Importar proyecto
        run: |
          set +e
          godot --headless --editor --path . --quit > import.log 2>&1
          STATUS=$?
          set -e
          cat import.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "SCRIPT ERROR:|Parse Error:|Failed to load script" import.log; then
            echo "La importación contiene errores."
            exit 1
          fi

      - name: Smoke test
        run: |
          set +e
          godot --headless --path . --script res://scripts/ci_smoke_test.gd > smoke.log 2>&1
          STATUS=$?
          set -e
          cat smoke.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "SMOKE FAIL:|SCRIPT ERROR:|Parse Error:|Failed to load script" smoke.log; then
            echo "El prototipo no supera la validación."
            exit 1
          fi
          grep -q "PIXEL ADVENTURE SMOKE OK:" smoke.log

      - name: Exportar Web
        run: |
          rm -rf web
          mkdir -p web
          set +e
          godot --headless --export-release "Web" web/index.html > export.log 2>&1
          STATUS=$?
          set -e
          cat export.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "SCRIPT ERROR:|Parse Error:|Failed to load script" export.log; then
            echo "La exportación Web contiene errores."
            exit 1
          fi
          test -s web/index.html
          test -s web/index.wasm
          test -s web/index.pck
          touch web/.nojekyll

      - name: Evitar caché antigua
        run: |
          BASE="index-${GITHUB_SHA}"

          mv web/index.wasm "web/${BASE}.wasm"
          mv web/index.pck "web/${BASE}.pck"

          if [ -f web/index.audio.worklet.js ]; then
            mv web/index.audio.worklet.js "web/${BASE}.audio.worklet.js"
          fi
          if [ -f web/index.audio.position.worklet.js ]; then
            mv web/index.audio.position.worklet.js "web/${BASE}.audio.position.worklet.js"
          fi
          if [ -f web/index.worker.js ]; then
            mv web/index.worker.js "web/${BASE}.worker.js"
          fi

          sed -i "s/\"executable\":\"index\"/\"executable\":\"${BASE}\"/g" web/index.html
          sed -i "s/\"index.pck\":/\"${BASE}.pck\":/g" web/index.html
          sed -i "s/\"index.wasm\":/\"${BASE}.wasm\":/g" web/index.html
          sed -i "s/src=\"index.js\"/src=\"index.js?v=${GITHUB_SHA}\"/g" web/index.html
          sed -i "s/src=\"index.png\"/src=\"index.png?v=${GITHUB_SHA}\"/g" web/index.html

          test -s "web/${BASE}.wasm"
          test -s "web/${BASE}.pck"
          grep -q "${BASE}" web/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy-pages:
    name: Publicar GitHub Pages
    needs: export-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar demo
        id: deployment
        uses: actions/deploy-pages@v5
