name: Materialize Pixel Adventure Assets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pixel-adventure-assets
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generar PNG desacoplados
        run: bash tools/materialize_assets_048.sh

      - name: Guardar assets en main
        shell: bash
        run: |
          set -e
          PATHS=(
            assets/backgrounds/demo_room/trees_far.png
            assets/backgrounds/demo_room/trees_mid.png
            assets/backgrounds/demo_room/trees_near.png
            assets/backgrounds/demo_room/ground.png
            assets/sprites/cartographer/world/idle_0.png
            assets/sprites/cartographer/world/idle_1.png
            assets/sprites/cartographer/world/talk_0.png
            assets/sprites/cartographer/world/talk_1.png
            assets/sprites/chest/chest_closed.png
            assets/sprites/chest/chest_opening.png
            assets/sprites/chest/chest_open.png
          )

          if [ -n "$(git status --porcelain -- "${PATHS[@]}")" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "${PATHS[@]}"
            git commit -m "assets: separar fondos, NPC y cofre en PNG"
            git push origin HEAD:main
          else
            echo "Los assets 0.4.8 ya están materializados."
          fi
